<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}圖書館管理系統{% endblock %}</title>
    
    <!-- Google Fonts: Roboto (英數優先) + Noto Sans TC (繁體中文) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome 6.5 Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Roboto', 'Noto Sans TC', sans-serif;
            background-color: #f4f6f9;
        }
        .navbar-backend { background-color: #1e293b !important; }
        .navbar-frontend { background-color: #0d6efd !important; }
        .barcode-badge {
            font-family: 'Roboto', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark {% if user.view_mode == ViewMode::Backend %}navbar-backend{% else %}navbar-frontend{% endif %} shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/admin/procurement">
                <i class="fa-solid fa-book-bookmark me-2"></i>
                {% if user.view_mode == ViewMode::Backend %}圖書館後台管理中心{% else %}圖書館前台檢索系統{% endif %}
            </a>

            <div class="d-flex align-items-center gap-2 ms-auto">
                <!-- 角色快速切換器 (方便測試不同 RBAC 權限) -->
                <form action="/switch-role" method="POST" class="d-flex align-items-center">
                    <select name="role" class="form-select form-select-sm bg-dark text-white border-secondary" onchange="this.form.submit()">
                        <option value="procurement" {% if user.role == Role::Procurement %}selected{% endif %}>角色：採購人員</option>
                        <option value="librarian_admin" {% if user.role == Role::LibrarianAdmin %}selected{% endif %}>角色：館長</option>
                        <option value="super_admin" {% if user.role == Role::SuperAdmin %}selected{% endif %}>角色：超級管理員</option>
                        <option value="librarian" {% if user.role == Role::Librarian %}selected{% endif %}>角色：圖書館員</option>
                        <option value="member" {% if user.role == Role::Member %}selected{% endif %}>角色：讀者</option>
                        <option value="guest" {% if user.role == Role::Guest %}selected{% endif %}>角色：訪客</option>
                    </select>
                </form>

                <!-- 具備後台權限者顯示前/後台切換按鈕 -->
                {% if user.role.can_access_backend() %}
                <form action="/switch-mode" method="POST" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-warning fw-medium">
                        {% if user.view_mode == ViewMode::Frontend %}
                            <i class="fa-solid fa-screwdriver-wrench me-1"></i>切換至後台
                        {% else %}
                            <i class="fa-solid fa-desktop me-1"></i>切換至前台
                        {% endif %}
                    </button>
                </form>
                {% endif %}

                <span class="badge bg-light text-dark py-2">
                    <i class="fa-solid fa-user-check me-1"></i>{{ user.username }} ({{ user.role.display_name() }})
                </span>
            </div>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
